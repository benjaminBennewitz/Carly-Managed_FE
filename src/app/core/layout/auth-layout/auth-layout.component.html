<!-- src/app/core/layout/auth-layout/auth-layout.component.html -->

<main class="auth-layout">
  <section class="auth-layout__brand" aria-labelledby="brand-title">
    <div class="auth-layout__aurora" aria-hidden="true">
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--primary"></span>
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--secondary"></span>
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--accent"></span>
    </div>

    <a class="auth-layout__logo" routerLink="/auth/login" aria-label="Carly Managed Startseite">
      <img [src]="themeService.logoPath()" alt="" width="720" height="180" />
    </a>

    <div class="auth-layout__intro">
      <p class="auth-layout__eyebrow">Collaborative workspace</p>
      <h1 id="brand-title">Gemeinsam planen, ohne den Überblick zu verlieren.</h1>
    </div>
  </section>

  <section class="auth-layout__content" aria-label="Authentifizierung">
    <div class="auth-layout__aurora auth-layout__mobile-aurora" aria-hidden="true">
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--primary"></span>
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--secondary"></span>
      <span class="auth-layout__aurora-ribbon auth-layout__aurora-ribbon--accent"></span>
    </div>

    <a
      class="auth-layout__mobile-logo"
      routerLink="/auth/login"
      aria-label="Carly Managed Startseite"
    >
      <img [src]="themeService.logoPath()" alt="" width="720" height="180" />
    </a>

    <div class="auth-layout__content-inner">
      <router-outlet />
    </div>

    <footer class="auth-layout__legal" aria-label="Rechtliche Informationen">
      <a routerLink="/datenschutz">Datenschutz</a>
      <span aria-hidden="true">·</span>
      <a routerLink="/impressum">Impressum</a>
    </footer>
  </section>
</main>
